name: Publish KONTAIRE Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Download latest built preview artifact
        env:
          ARTIFACT_URL: "https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-2c10-820c-b18c-a96658c3dbdd/raw?se=2026-09-04T16%3A29%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=70ef800e-4e05-5610-9c0e-159cf43f5263&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T16%3A13%3A14Z&ske=2026-09-05T16%3A13%3A14Z&sks=b&skv=2026-02-06&sig=rr2DzUBWlvlgxQ%2BLHFZXygPRofJZf8ZuaMa7J6j7170%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o build.zip
          mkdir site
          unzip -q build.zip -d site
          cp receipt.html site/receipt.html
          rm -f site/metadata.json
          touch site/.nojekyll

      - name: Publish built files to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish KONTAIRE preview with electronic receipt QR"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
