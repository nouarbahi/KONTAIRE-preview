name: Publish KONTAIRE Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Download latest built preview artifact
        env:
          ARTIFACT_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-a6ec-820a-8e9e-40a33c602a92/raw?se=2026-09-05T00%3A01%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=87bc5b95-e651-5348-a5c8-f0761675568a&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A25%3A11Z&ske=2026-09-05T23%3A25%3A11Z&sks=b&skv=2026-02-06&sig=RfAly1BDsdT4HB9akjmmer7l7nKn0etzS%2BcBT1K8Xis%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o build.zip
          mkdir site
          unzip -q build.zip -d site
          cp receipt.html site/receipt.html
          rm -f site/metadata.json
          touch site/.nojekyll

      - name: Publish built files to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish KONTAIRE preview with QR centered in reserved space"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
