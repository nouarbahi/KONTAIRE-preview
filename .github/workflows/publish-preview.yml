name: Publish KONTAIRE Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Download latest built preview artifact
        env:
          ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-93b0-8210-9ece-69730058f093/raw?se=2026-09-05T00%3A24%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=2b4c82f4-1fef-52b0-aa41-f68ae2fef8bd&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A16%3A16Z&ske=2026-09-05T23%3A16%3A16Z&sks=b&skv=2026-02-06&sig=AukWGozfLE5jOtUsFkz1XyK/f1L7iXoJ8IiZDYuSSe8%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o build.zip
          mkdir site
          unzip -q build.zip -d site
          cp receipt.html site/receipt.html
          rm -f site/metadata.json
          touch site/.nojekyll

      - name: Publish built files to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish KONTAIRE preview with welcome and dev login flow"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
