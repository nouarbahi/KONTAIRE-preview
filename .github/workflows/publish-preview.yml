name: Publish KONTAIRE Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Download latest built preview artifact
        env:
          ARTIFACT_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-e828-8208-9151-2fa913eb3cf1/raw?se=2026-09-05T13%3A00%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=f0f5deb9-dc29-569a-b118-183da81a0d3b&skoid=3cb6de21-012a-49c9-9402-a1ebf8d0bd06&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A21%3A02Z&ske=2026-09-05T23%3A21%3A02Z&sks=b&skv=2026-02-06&sig=dFDDoCirXbzkIqXPfpZRIhHFkHF7A3FzvhjQccrQXjE%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o build.zip
          mkdir site
          unzip -q build.zip -d site
          cp receipt.html site/receipt.html
          rm -f site/metadata.json
          touch site/.nojekyll

      - name: Cache-bust published JavaScript
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['GITHUB_SHA'][:12]
          for filename in ('index.html', '404.html'):
              path = Path('site') / filename
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r'(<script src="[^"]+\.js)(?:\?[^\"]*)?(" defer></script>)',
                  rf'\1?v={version}\2',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Could not cache-bust JavaScript in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Publish built files to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish KONTAIRE preview with driver pricing system"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages