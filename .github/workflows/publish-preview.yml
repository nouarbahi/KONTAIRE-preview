name: Publish KONTAIRE Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest built preview artifact
        env:
          ARTIFACT_URL: "https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-4b3c-820c-af97-4d4fecf8ec57/raw?se=2026-09-04T15%3A49%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=7435e7e9-8b20-5093-ad2d-d471a7670089&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T02%3A18%3A15Z&ske=2026-09-05T02%3A18%3A15Z&sks=b&skv=2026-02-06&sig=PDbIwN7xGcwtc9oTJe2j4PocY24yxW37qDJwN0vxEVk%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o build.zip
          mkdir site
          unzip -q build.zip -d site
          rm -f site/metadata.json
          touch site/.nojekyll

      - name: Publish built files to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish KONTAIRE preview with login bypass"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
