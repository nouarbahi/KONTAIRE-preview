name: Publish KONTAIRE Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Download latest built preview artifact
        env:
          ARTIFACT_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-7eac-8246-a110-7600d93b0e5f/raw?se=2026-09-05T00%3A13%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=ed2cb468-6b21-528d-9490-1fd5cecec919&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A14%3A52Z&ske=2026-09-05T23%3A14%3A52Z&sks=b&skv=2026-02-06&sig=V6qvPxUDQQI5gQ6WsH3J5%2BoRYV/adXhaVLIlnk0d1zY%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o build.zip
          mkdir site
          unzip -q build.zip -d site
          cp receipt.html site/receipt.html
          rm -f site/metadata.json
          touch site/.nojekyll

      - name: Publish built files to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish KONTAIRE preview after cleaning Profile screen"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
