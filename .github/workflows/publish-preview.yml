name: Publish KONTAIRE Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download corrected built preview artifact
        env:
          ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-7160-81f5-85f4-5602ffae13e0/raw?se=2026-09-04T15%3A22%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=fa19a145-1d80-5526-b5f7-76a45f8b707a&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A20%3A09Z&ske=2026-09-05T03%3A20%3A09Z&sks=b&skv=2026-02-06&sig=dtJbHg%2BA7Xt%2BAOXLnkNqgVU/2vbDunix39%2BZDvMpE14%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o build.zip
          mkdir site
          unzip -q build.zip -d site
          rm -f site/metadata.json
          touch site/.nojekyll

      - name: Publish built files to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish corrected KONTAIRE preview"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
